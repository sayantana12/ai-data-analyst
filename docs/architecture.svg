<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<style>
.box{fill:#f7f7f7;stroke:#333;stroke-width:2}.llm{fill:#eaf4ff;stroke:#1d5f99;stroke-width:3}.tool{fill:#f4f0ff;stroke:#65449a;stroke-width:2}.title{font:700 20px Arial}.txt{font:15px Arial}.small{font:13px Arial}.arrow{stroke:#333;stroke-width:2;marker-end:url(#m)}
</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="40" y="42" class="title">AI-Powered Data Analyst — LLM Agent + Local Analytics Architecture</text>

<rect x="40" y="80" width="210" height="120" rx="12" class="box"/>
<text x="65" y="115" class="title">User / Streamlit</text><text x="65" y="145" class="txt">CSV upload</text><text x="65" y="170" class="txt">Chat / dashboard</text>

<rect x="310" y="80" width="240" height="120" rx="12" class="box"/>
<text x="335" y="115" class="title">Ingestion</text><text x="335" y="145" class="txt">Validate CSVs</text><text x="335" y="170" class="txt">Multi-file + schema</text>

<rect x="610" y="60" width="330" height="160" rx="12" class="llm"/>
<text x="650" y="100" class="title">LLM Analyst Agent</text><text x="650" y="130" class="txt">Understand → plan → call tools</text><text x="650" y="158" class="txt">Inspect evidence → call again if needed</text><text x="650" y="186" class="txt">Final answer + reasoning summary</text>

<line x1="250" y1="140" x2="310" y2="140" class="arrow"/><line x1="550" y1="140" x2="610" y2="140" class="arrow"/>

<rect x="40" y="300" width="200" height="105" rx="12" class="tool"/><text x="75" y="335" class="title">SQL Tool</text><text x="75" y="365" class="txt">Read-only DuckDB</text><text x="75" y="388" class="txt">SELECT / WITH</text>
<rect x="280" y="300" width="200" height="105" rx="12" class="tool"/><text x="310" y="335" class="title">Pandas Tool</text><text x="310" y="365" class="txt">Safe operations</text><text x="310" y="388" class="txt">No arbitrary exec</text>
<rect x="520" y="300" width="200" height="105" rx="12" class="tool"/><text x="555" y="335" class="title">Chart Tool</text><text x="555" y="365" class="txt">Bar / Line / Pie</text><text x="555" y="388" class="txt">Scatter / Histogram</text>
<rect x="760" y="300" width="200" height="105" rx="12" class="tool"/><text x="795" y="335" class="title">Anomaly Tool</text><text x="795" y="365" class="txt">IQR / z-score</text><text x="795" y="388" class="txt">Rule + flagged rows</text>
<rect x="1000" y="300" width="200" height="105" rx="12" class="tool"/><text x="1035" y="335" class="title">Forecast Tool</text><text x="1035" y="365" class="txt">CPU trend model</text><text x="1035" y="388" class="txt">Future values</text>
<rect x="1240" y="300" width="120" height="105" rx="12" class="tool"/><text x="1250" y="335" class="title">Search</text><text x="1250" y="365" class="txt">TF-IDF</text><text x="1250" y="388" class="txt">semantic</text>

<line x1="700" y1="220" x2="140" y2="300" class="arrow"/><line x1="700" y1="220" x2="380" y2="300" class="arrow"/><line x1="700" y1="220" x2="620" y2="300" class="arrow"/><line x1="700" y1="220" x2="860" y2="300" class="arrow"/><line x1="700" y1="220" x2="1100" y2="300" class="arrow"/><line x1="700" y1="220" x2="1300" y2="300" class="arrow"/>

<rect x="180" y="485" width="1040" height="110" rx="12" class="box"/>
<text x="520" y="525" class="title">Tool Results / Evidence</text>
<text x="270" y="558" class="txt">Tables • statistics • charts • anomalies • forecasts • search results • dashboard specs</text>

<line x1="700" y1="405" x2="700" y2="485" class="arrow"/>

<rect x="420" y="655" width="560" height="105" rx="12" class="llm"/>
<text x="570" y="695" class="title">LLM Evidence Evaluation</text>
<text x="475" y="725" class="txt">Verify evidence → synthesize → explain → final response</text>
<line x1="700" y1="595" x2="700" y2="655" class="arrow"/>
</svg>
